<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - ISSE</title>
    <link rel="icon" type="image/png" href="images/new-logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0B1A3A 0%, #1A2A5A 100%);
            padding: 20px;
        }

        .admin-login-box {
            background: #FFFFFF;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 420px;
        }

        body.dark-mode .admin-login-box {
            background: #122240;
        }

        .admin-login-box .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .admin-login-box .logo img {
            height: 60px;
            width: auto;
            margin: 0 auto 10px;
        }

        .admin-login-box .logo h2 {
            font-size: 22px;
            color: #0B1A3A;
            margin-bottom: 5px;
        }

        body.dark-mode .admin-login-box .logo h2 {
            color: #FFFFFF;
        }

        .admin-login-box .logo p {
            font-size: 14px;
            color: #7F8C8D;
            margin: 0;
        }

        body.dark-mode .admin-login-box .logo p {
            color: #B0C4DE;
        }

        .admin-login-box .form-group {
            margin-bottom: 20px;
        }

        .admin-login-box .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #0B1A3A;
            margin-bottom: 5px;
        }

        body.dark-mode .admin-login-box .form-group label {
            color: #E8ECF0;
        }

        .admin-login-box .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E8ECF0;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease;
        }
        .admin-login-box .password-field-wrapper input {
            padding-right: 44px;
        }

        body.dark-mode .admin-login-box .form-group input {
            background-color: #0D1A30;
            color: #FFFFFF;
            border-color: #1A3A5A;
        }

        .admin-login-box .form-group input:focus {
            outline: none;
            border-color: #D4A843;
            box-shadow: 0 0 0 3px rgba(212, 168, 67, 0.1);
        }

        .admin-login-box .login-error {
            display: none;
            background-color: #FDE8E8;
            color: #E74C3C;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border-left: 4px solid #E74C3C;
        }

        .admin-login-box .login-error.visible {
            display: block;
        }

        .admin-login-box .login-success {
            display: none;
            background-color: #E8F8F0;
            color: #27AE60;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            margin-bottom: 20px;
            border-left: 4px solid #27AE60;
        }

        .admin-login-box .login-success.visible {
            display: block;
        }

        .admin-login-box .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
        }

        .admin-login-box .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .admin-login-box .forgot-link {
            display: block;
            text-align: right;
            font-size: 13px;
            color: #7F8C8D;
            margin-top: 8px;
            transition: color 0.3s ease;
        }

        .admin-login-box .forgot-link:hover {
            color: #D4A843;
        }

        .admin-login-box .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #7F8C8D;
            transition: color 0.3s ease;
        }

        .admin-login-box .back-link:hover {
            color: #D4A843;
        }

        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 15px;
        }

        .loading-spinner.visible {
            display: block;
        }

        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #E8ECF0;
            border-top: 3px solid #D4A843;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="admin-login-page">
        <div class="admin-login-box">
            <div class="logo">
                <img src="images/new-logo.png" alt="ISSE Logo">
                <h2>Admin Login</h2>
                <p>Sign in to manage the ISSE website</p>
            </div>

            <div class="login-error" id="loginError"></div>
            <div class="login-success" id="loginSuccess"></div>

            <form id="adminLoginForm">
                <div class="form-group">
                    <label for="adminEmail">Email Address</label>
                    <input type="email" id="adminEmail" placeholder="you@example.com" autocomplete="username" required>
                </div>
                <div class="form-group">
                    <label for="adminPassword">Password</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="adminPassword" placeholder="Enter your password" autocomplete="current-password" required>
                        <button type="button" class="password-toggle-btn" aria-label="Show password"></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="loginButton">Sign in</button>
                <a href="#" class="forgot-link" id="forgotPasswordLink">Forgot password?</a>
            </form>

            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #7F8C8D; font-size: 14px;">Signing in...</p>
            </div>

            <a href="index.html" class="back-link">← Back to the website</a>
        </div>
    </div>

    <!-- FORGOT PASSWORD MODAL -->
    <div class="modal-overlay" id="forgotModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.5); z-index:2000; align-items:center; justify-content:center;">
        <div class="modal-box" style="background:#FFFFFF; border-radius:16px; padding:35px 40px; width:100%; max-width:420px;">
            <h2 style="font-size:24px; color:#0B1A3A; margin-bottom:20px;">Reset Password</h2>
            <p style="color:#7F8C8D; font-size:14px; margin-bottom:18px;">Enter your email address and we'll send you a link to reset your password.</p>
            <div class="form-group">
                <label for="resetEmail">Email Address</label>
                <input type="email" id="resetEmail" placeholder="you@example.com" required>
            </div>
            <div id="resetMessage" style="font-size:14px; margin-top:10px;"></div>
            <div class="modal-actions" style="display:flex; gap:12px; margin-top:20px;">
                <button class="btn btn-primary" id="sendResetBtn">Send Reset Link</button>
                <button class="btn btn-cancel" id="cancelResetBtn" style="background:#E8ECF0; color:#2C3E50; padding:10px 30px; border-radius:50px; border:none; cursor:pointer;">Cancel</button>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        // ==================== ADMIN LOGIN ====================
        const loginForm = document.getElementById('adminLoginForm');
        const loginError = document.getElementById('loginError');
        const loginSuccess = document.getElementById('loginSuccess');
        const loginButton = document.getElementById('loginButton');
        const loadingSpinner = document.getElementById('loadingSpinner');

        const supabaseClient = db;

        function showLoginError(text) {
            loginError.textContent = text;
            loginError.classList.add('visible');
        }

        function showLoginSuccess(text) {
            loginSuccess.textContent = text;
            loginSuccess.classList.add('visible');
        }

        function hideMessages() {
            loginError.classList.remove('visible');
            loginSuccess.classList.remove('visible');
        }

        // Redirect if already logged in
        (async function() {
            const admin = await getCurrentAdmin();
            if (admin) {
                window.location.replace('admin-dashboard.html');
            }
        })();

        // Show a message if we were redirected here after a password
        // update or account deletion
        (function() {
            const params = new URLSearchParams(window.location.search);
            if (params.get('updated') === 'true') {
                showLoginSuccess('✅ Password updated successfully! Please sign in.');
            } else if (params.get('deleted') === 'true') {
                showLoginSuccess('✅ Account deleted successfully.');
            }
        })();

        // Login form submit
        loginForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            hideMessages();

            const email = document.getElementById('adminEmail').value.trim();
            const password = document.getElementById('adminPassword').value;

            if (!email || !password) {
                showLoginError('Please enter both email and password.');
                return;
            }

            loginButton.disabled = true;
            loginButton.textContent = 'Signing in…';
            loadingSpinner.classList.add('visible');

            try {
                // Sign in with Supabase Auth
                const { data, error } = await supabaseClient.auth.signInWithPassword({
                    email: email,
                    password: password
                });

                if (error) {
                    throw error;
                }

                // Check if user has admin profile
                const { data: profile, error: profileError } = await supabaseClient
                    .from('admin_profiles')
                    .select('*')
                    .eq('id', data.user.id)
                    .maybeSingle();

                if (profileError || !profile) {
                    // User exists but not an admin
                    await supabaseClient.auth.signOut();
                    throw new Error('Access denied. You are not authorized as an admin.');
                }

                if (profile.is_active === false) {
                    await supabaseClient.auth.signOut();
                    throw new Error('Your admin account has been deactivated.');
                }

                // Update last login
                await supabaseClient
                    .from('admin_profiles')
                    .update({ last_login: new Date() })
                    .eq('id', data.user.id);

                // Log activity
                await logActivity('Admin Login', profile);

                // Show success and redirect
showLoginSuccess('✅ Login successful! Redirecting...');
loginButton.disabled = true;

// Wait a moment for session to be fully established
await new Promise(resolve => setTimeout(resolve, 1500));

// Verify session exists before redirecting
const { data: { session } } = await supabaseClient.auth.getSession();
console.log('🔍 Session before redirect:', session ? 'exists' : 'null');

if (session) {
    window.location.href = 'admin-dashboard.html';
} else {
    showLoginError('Session not established. Please try again.');
    loginButton.disabled = false;
    loginButton.textContent = 'Sign in';
    loadingSpinner.classList.remove('visible');
}

            } catch (error) {
                console.error('Login error:', error);
                showLoginError(error.message || 'Invalid email or password. Please try again.');
                loginButton.disabled = false;
                loginButton.textContent = 'Sign in';
                loadingSpinner.classList.remove('visible');
            }
        });

        // ==================== FORGOT PASSWORD ====================
        const forgotModal = document.getElementById('forgotModal');
        const forgotLink = document.getElementById('forgotPasswordLink');
        const cancelResetBtn = document.getElementById('cancelResetBtn');
        const sendResetBtn = document.getElementById('sendResetBtn');
        const resetEmail = document.getElementById('resetEmail');
        const resetMessage = document.getElementById('resetMessage');

        forgotLink.addEventListener('click', function(e) {
            e.preventDefault();
            resetEmail.value = document.getElementById('adminEmail').value || '';
            resetMessage.textContent = '';
            resetMessage.className = '';
            forgotModal.style.display = 'flex';
        });

        cancelResetBtn.addEventListener('click', function() {
            forgotModal.style.display = 'none';
        });

        forgotModal.addEventListener('click', function(e) {
            if (e.target === this) this.style.display = 'none';
        });

        sendResetBtn.addEventListener('click', async function() {
    const email = resetEmail.value.trim();
    if (!email) {
        resetMessage.textContent = 'Please enter your email address.';
        resetMessage.style.color = '#E74C3C';
        return;
    }

    sendResetBtn.disabled = true;
    sendResetBtn.textContent = 'Sending...';

    try {
        // First, check if this email exists and is active
        const { data: admin, error: findError } = await supabaseClient
            .from('admin_profiles')
            .select('email, is_active')
            .eq('email', email)
            .maybeSingle();

        if (findError) throw findError;

        if (!admin) {
            resetMessage.textContent = 'No admin account found with this email.';
            resetMessage.style.color = '#E74C3C';
            sendResetBtn.disabled = false;
            sendResetBtn.textContent = 'Send Reset Link';
            return;
        }

        if (admin.is_active === false) {
            resetMessage.textContent = 'This admin account has been deactivated. Please contact a Super Admin.';
            resetMessage.style.color = '#E74C3C';
            sendResetBtn.disabled = false;
            sendResetBtn.textContent = 'Send Reset Link';
            return;
        }

        // Send password reset email via Supabase
        const { error } = await supabaseClient.auth.resetPasswordForEmail(email, {
            redirectTo: SITE_ORIGIN + '/admin-update-password.html'
        });

        if (error) throw error;

        resetMessage.textContent = '✅ Password reset link sent to your email.';
        resetMessage.style.color = '#27AE60';
        sendResetBtn.disabled = false;
        sendResetBtn.textContent = 'Send Reset Link';

        setTimeout(() => {
            forgotModal.style.display = 'none';
        }, 3000);

    } catch (error) {
        console.error('Error sending reset link:', error);
        resetMessage.textContent = 'Error: ' + (error.message || 'Something went wrong. Please try again.');
        resetMessage.style.color = '#E74C3C';
        sendResetBtn.disabled = false;
        sendResetBtn.textContent = 'Send Reset Link';
    }
});
    </script>
</body>
</html>
