<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academy Dashboard - ISSE</title>
    <link rel="icon" type="image/png" href="images/new-logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-panel { display: flex; min-height: 100vh; background-color: #F5F7FA; }
        .admin-sidebar { width: 260px; background-color: #0B1A3A; color: #FFFFFF; padding: 20px 0; position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; z-index: 1000; transition: transform 0.3s ease; }
        .admin-sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px; text-align: center; }
        .admin-sidebar .logo img { height: 45px; width: auto; margin: 0 auto 8px; }
        .admin-sidebar .logo h3 { font-size: 16px; color: #FFFFFF; margin: 0; }
        .admin-sidebar .logo p { font-size: 12px; color: #B0C4DE; margin: 0; }
        .admin-sidebar .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #B0C4DE; text-decoration: none; transition: all 0.3s ease; border-left: 3px solid transparent; font-size: 14px; font-weight: 500; }
        .admin-sidebar .nav-item:hover { background-color: rgba(255,255,255,0.05); color: #FFFFFF; }
        .admin-sidebar .nav-item.active { background-color: rgba(212,168,67,0.1); color: #D4A843; border-left-color: #D4A843; }
        .admin-sidebar .nav-item .icon { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
        .admin-sidebar .nav-item.logout { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px; }
        .admin-sidebar .nav-item.logout .icon { filter: brightness(0) saturate(100%) invert(48%) sepia(71%) saturate(423%) hue-rotate(340deg) brightness(95%) contrast(94%); }
        .admin-sidebar .nav-item.logout:hover { background-color: rgba(231,76,60,0.1); }
        .admin-main { margin-left: 260px; padding: 30px; flex: 1; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #E8ECF0; }
        .admin-header h1 { font-size: 28px; color: #0B1A3A; margin: 0; }
        .admin-header .admin-info { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #2C3E50; }
        .admin-header .admin-info .role-badge { background-color: #D4A843; color: #0B1A3A; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; }
        .admin-hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 5px; background: none; border: none; }
        .admin-hamburger span { display: block; width: 25px; height: 3px; background-color: #0B1A3A; border-radius: 3px; }

        .sidebar-skeleton {
            position: fixed;
            top: 0;
            left: 0;
            width: 260px;
            height: 100vh;
            background-color: #0B1A3A;
            padding: 24px 20px;
            z-index: 999;
            opacity: 1;
            transition: opacity 0.25s ease;
        }
        body.nav-ready .sidebar-skeleton { opacity: 0; pointer-events: none; }
        .sidebar-skeleton .skel-logo {
            width: 45px; height: 45px; border-radius: 50%;
            margin: 0 auto 24px;
            background: rgba(255,255,255,0.08);
            animation: skeletonPulse 1.4s ease-in-out infinite;
        }
        .sidebar-skeleton .skel-line {
            height: 14px; border-radius: 6px;
            margin-bottom: 18px;
            background: rgba(255,255,255,0.08);
            animation: skeletonPulse 1.4s ease-in-out infinite;
        }
        @keyframes skeletonPulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 0.9; }
        }

        .stats-grid-admin { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card-admin { background: #FFFFFF; padding: 25px 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); text-align: center; transition: all 0.3s ease; }
        .stat-card-admin:hover { transform: translateY(-4px); box-shadow: 0 8px 30px rgba(0,0,0,0.1); }
        .stat-card-admin .number { font-family: 'Poppins', sans-serif; font-size: 36px; font-weight: 800; color: #0B1A3A; }
        .stat-card-admin .label { font-size: 14px; color: #7F8C8D; margin: 5px 0 0; }
        .stat-card-admin .stat-icon { width: 32px; height: 32px; object-fit: contain; margin-bottom: 5px; }

        .admin-actions { display: flex; gap: 15px; margin-bottom: 25px; flex-wrap: wrap; }
        .admin-actions .btn { padding: 10px 25px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .admin-actions .btn img { width: 16px; height: 16px; object-fit: contain; }
        .admin-table-wrapper { background: #FFFFFF; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); overflow-x: auto; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .admin-table th { background-color: #F5F7FA; padding: 12px 15px; text-align: left; font-weight: 600; color: #0B1A3A; border-bottom: 2px solid #E8ECF0; }
        .admin-table td { padding: 12px 15px; border-bottom: 1px solid #F5F7FA; color: #2C3E50; }
        .admin-table tr:hover { background-color: #FAFBFC; }
        .admin-table .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .admin-table .btn-small { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 4px; }
        .admin-table .btn-small img { width: 14px; height: 14px; object-fit: contain; }
        .btn-edit { background-color: #D4A843; color: #0B1A3A; }
        .btn-edit:hover { background-color: #C49A3A; }
        .btn-delete { background-color: #E74C3C; color: #FFFFFF; }
        .btn-delete:hover { background-color: #C0392B; }
        .btn-view { background-color: #2C3E50; color: #FFFFFF; }
        .btn-view:hover { background-color: #1A2A3A; }

        .empty-state { text-align: center; padding: 40px 20px; color: #7F8C8D; }
        .empty-state .icon { width: 48px; height: 48px; object-fit: contain; margin-bottom: 10px; }

        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; align-items: center; justify-content: center; }
        .modal-overlay.visible { display: flex; }
        .modal-box { background: #FFFFFF; border-radius: 16px; padding: 35px 40px; width: 100%; max-width: 550px; max-height: 90vh; overflow-y: auto; }
        .modal-box h2 { font-size: 24px; color: #0B1A3A; margin-bottom: 20px; }
        .modal-box .form-group { margin-bottom: 18px; }
        .modal-box .form-group label { display: block; font-size: 14px; font-weight: 600; color: #0B1A3A; margin-bottom: 5px; }
        .modal-box .form-group input, .modal-box .form-group select, .modal-box .form-group textarea { width: 100%; padding: 10px 15px; border: 1px solid #E8ECF0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; }
        .modal-box .form-group input:focus, .modal-box .form-group select:focus, .modal-box .form-group textarea:focus { outline: none; border-color: #D4A843; }
        .modal-box .form-group textarea { resize: vertical; min-height: 100px; }
        .modal-box .modal-actions { display: flex; gap: 12px; margin-top: 20px; }
        .modal-box .modal-actions .btn { padding: 10px 30px; font-size: 14px; display: flex; align-items: center; gap: 8px; }
        .modal-box .modal-actions .btn img { width: 16px; height: 16px; object-fit: contain; }
        .btn-cancel { background-color: #E8ECF0; color: #2C3E50; }
        .btn-cancel:hover { background-color: #D5D8DC; }

        .message { padding: 10px 14px; border-radius: 8px; margin-top: 12px; display: none; font-size: 14px; }
        .message.success { display: block; background: #d4edda; color: #155724; border-left: 4px solid #28a745; }
        .message.error { display: block; background: #f8d7da; color: #721c24; border-left: 4px solid #dc3545; }

        .role-tag { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .role-super { background-color: #D4A843; color: #0B1A3A; }
        .role-hoas { background-color: #3498DB; color: #FFFFFF; }
        .role-academic { background-color: #2ECC71; color: #FFFFFF; }
        .role-lecturer { background-color: #9B59B6; color: #FFFFFF; }

        .status-active { color: #27AE60; font-weight: 600; }
        .status-inactive { color: #E74C3C; font-weight: 600; }

        .filter-bar { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; align-items: center; }
        .filter-bar select, .filter-bar input { padding: 8px 14px; border: 1px solid #E8ECF0; border-radius: 8px; font-size: 14px; font-family: 'Inter', sans-serif; background: #FFFFFF; }
        .filter-bar select:focus, .filter-bar input:focus { outline: none; border-color: #D4A843; }
                .filter-dropdown { position: relative; display: inline-block; }
        .filter-dropdown-btn { padding: 8px 16px; border: 1px solid #E8ECF0; border-radius: 8px; background: #FFFFFF; font-size: 14px; cursor: pointer; font-family: 'Inter', sans-serif; }
        .filter-dropdown-panel { display: none; position: absolute; top: 110%; left: 0; background: #FFFFFF; border: 1px solid #E8ECF0; border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 16px; min-width: 260px; z-index: 500; }
        .filter-dropdown-panel.open { display: block; }
        .filter-dropdown-panel h4 { font-size: 13px; color: #7F8C8D; margin: 0 0 8px; }
        .filter-check-row { display: flex; align-items: center; gap: 8px; padding: 5px 0; font-size: 14px; }
        .filter-panel-actions { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid #F5F7FA; padding-top: 12px; }
        body.dark-mode .filter-dropdown-btn { background-color: #0D1A30; color: #E8ECF0; border-color: #1A3A5A; }
        body.dark-mode .filter-dropdown-panel { background-color: #122240; border-color: #1A3A5A; }

        .admin-dropdown { position: relative; display: inline-block; }
        .admin-dropdown-btn { background: none; border: none; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-radius: 8px; transition: background-color 0.3s ease; font-size: 14px; color: #2C3E50; font-family: 'Inter', sans-serif; }
        .admin-dropdown-btn:hover { background-color: rgba(0,0,0,0.05); }
        .dropdown-arrow { font-size: 10px; transition: transform 0.3s ease; }
        .admin-dropdown-btn.active .dropdown-arrow { transform: rotate(180deg); }
        .admin-dropdown-menu { display: none; position: absolute; right: 0; top: 110%; background: #FFFFFF; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,0.15); min-width: 180px; padding: 8px 0; z-index: 1000; border: 1px solid #E8ECF0; }
        .admin-dropdown-menu.show { display: block; }
        .dropdown-item { display: flex; align-items: center; gap: 10px; padding: 10px 18px; color: #2C3E50; text-decoration: none; font-size: 14px; transition: background-color 0.3s ease; cursor: pointer; }
        .dropdown-item:hover { background-color: #F5F7FA; }
        .dropdown-divider { border: none; border-top: 1px solid #E8ECF0; margin: 4px 12px; }

        /* Thread reply styles */
        .thread-wrapper { background: #FFFFFF; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); overflow: hidden; }
        .thread-contact-card { display: flex; align-items: center; gap: 16px; padding: 20px 24px; border-bottom: 1px solid #E8ECF0; flex-wrap: wrap; }
        .thread-avatar { width: 48px; height: 48px; border-radius: 50%; background-color: #E3F0FF; color: #0B1A3A; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px; flex-shrink: 0; }
        .thread-contact-meta { flex: 1; min-width: 200px; }
        .thread-contact-meta h2 { font-size: 17px; color: #0B1A3A; margin: 0 0 2px; }
        .thread-contact-meta .thread-email { font-size: 13px; color: #7F8C8D; margin: 0; }
        .thread-body { padding: 24px; min-height: 200px; max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; background-color: #FAFBFC; }
        .thread-bubble-row { display: flex; flex-direction: column; max-width: 70%; }
        .thread-bubble-row.incoming { align-self: flex-start; align-items: flex-start; }
        .thread-bubble-row.outgoing { align-self: flex-end; align-items: flex-end; }
        .thread-bubble { padding: 14px 16px; border-radius: 14px; font-size: 14px; line-height: 1.5; color: #2C3E50; white-space: pre-wrap; word-break: break-word; }
        .thread-bubble-row.incoming .thread-bubble { background-color: #FFFFFF; border: 1px solid #E8ECF0; border-bottom-left-radius: 4px; }
        .thread-bubble-row.outgoing .thread-bubble { background-color: #DCEBFF; border-bottom-right-radius: 4px; }
        .thread-bubble-meta { font-size: 11px; color: #7F8C8D; margin-top: 4px; padding: 0 4px; }
        .thread-reply-box { border-top: 1px solid #E8ECF0; padding: 16px 24px; display: flex; gap: 12px; align-items: flex-end; background: #FFFFFF; }
        .thread-reply-box textarea { flex: 1; resize: none; min-height: 46px; max-height: 140px; padding: 12px 15px; border: 1px solid #E8ECF0; border-radius: 10px; font-size: 14px; font-family: 'Inter', sans-serif; }
        .thread-reply-box textarea:focus { outline: none; border-color: #D4A843; box-shadow: 0 0 0 3px rgba(212,168,67,0.1); }
        .thread-reply-box .btn-send { background-color: #0B1A3A; color: #FFFFFF; border: none; padding: 12px 22px; border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; white-space: nowrap; transition: background-color 0.2s ease; }
        .thread-reply-box .btn-send:hover { background-color: #16255A; }

        /* Dark Mode */
        body.dark-mode .admin-panel, body.dark-mode .admin-main { background-color: #0A1628; }
        body.dark-mode .admin-header { border-bottom-color: #1A3A5A; }
        body.dark-mode .admin-header h1 { color: #FFFFFF; }
        body.dark-mode .admin-info { color: #B0C4DE; }
        body.dark-mode .stat-card-admin { background-color: #122240; box-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        body.dark-mode .stat-card-admin .number { color: #FFFFFF; }
        body.dark-mode .stat-card-admin .label { color: #B0C4DE; }
        body.dark-mode .admin-table-wrapper { background-color: #122240; }
        body.dark-mode .admin-table th { background-color: #0D1A30; color: #FFFFFF; border-bottom-color: #1A3A5A; }
        body.dark-mode .admin-table td { color: #B0C4DE; border-bottom-color: #1A3A5A; }
        body.dark-mode .admin-table tr:hover { background-color: rgba(255,255,255,0.03); }
        body.dark-mode .modal-box { background-color: #122240; }
        body.dark-mode .modal-box h2 { color: #FFFFFF; }
        body.dark-mode .modal-box label { color: #E8ECF0; }
        body.dark-mode .modal-box input, body.dark-mode .modal-box select, body.dark-mode .modal-box textarea { background-color: #0D1A30; color: #E8ECF0; border-color: #1A3A5A; }
        body.dark-mode .modal-box input:focus, body.dark-mode .modal-box select:focus, body.dark-mode .modal-box textarea:focus { border-color: #D4A843; }
        body.dark-mode .btn-cancel { background-color: #1A3A5A; color: #FFFFFF; }
        body.dark-mode .btn-cancel:hover { background-color: #2A4A6A; }
        body.dark-mode .empty-state { color: #B0C4DE; }
        body.dark-mode .admin-sidebar { background-color: #060F1F; }
        body.dark-mode .filter-bar select, body.dark-mode .filter-bar input { background-color: #0D1A30; color: #E8ECF0; border-color: #1A3A5A; }
        body.dark-mode .thread-wrapper { background-color: #122240; }
        body.dark-mode .thread-contact-card { border-bottom-color: #1A3A5A; }
        body.dark-mode .thread-avatar { background-color: #1A3A5A; color: #E8ECF0; }
        body.dark-mode .thread-contact-meta h2 { color: #E8ECF0; }
        body.dark-mode .thread-contact-meta .thread-email { color: #B0C4DE; }
        body.dark-mode .thread-body { background-color: #0A1628; }
        body.dark-mode .thread-bubble { color: #E8ECF0; }
        body.dark-mode .thread-bubble-row.incoming .thread-bubble { background-color: #0D1A30; border-color: #1A3A5A; }
        body.dark-mode .thread-bubble-row.outgoing .thread-bubble { background-color: #1A3A5A; }
        body.dark-mode .thread-bubble-meta { color: #B0C4DE; }
        body.dark-mode .thread-reply-box { background-color: #122240; border-top-color: #1A3A5A; }
        body.dark-mode .thread-reply-box textarea { background-color: #0D1A30; border-color: #1A3A5A; color: #E8ECF0; }
        body.dark-mode .thread-reply-box textarea::placeholder { color: #7F8C8D; }
        body.dark-mode .btn-send { background-color: #D4A843; color: #0B1A3A; }
        body.dark-mode .btn-send:hover { background-color: #C49A3A; }
        body.dark-mode .admin-dropdown-btn { color: #B0C4DE; }
        body.dark-mode .admin-dropdown-menu { background-color: #122240; border-color: #1A3A5A; }
        body.dark-mode .dropdown-item { color: #B0C4DE; }
        body.dark-mode .dropdown-item:hover { background-color: #0D1A30; }

        @media (max-width: 992px) { .stats-grid-admin { grid-template-columns: repeat(2, 1fr); } }
        @media (max-width: 768px) {
            .admin-sidebar { transform: translateX(-100%); width: 280px; }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; padding: 20px; }
            .admin-hamburger { display: flex; }
            .admin-header h1 { font-size: 22px; }
            .stats-grid-admin { grid-template-columns: 1fr 1fr; gap: 15px; }
            .modal-box { padding: 25px 20px; margin: 20px; }
            .filter-bar { flex-direction: column; }
            .filter-bar select, .filter-bar input, .filter-bar .btn { width: 100%; }
            .thread-bubble-row { max-width: 88%; }
        }
        @media (max-width: 480px) {
            .stats-grid-admin { grid-template-columns: 1fr; }
            .admin-table { font-size: 12px; }
            .admin-table th, .admin-table td { padding: 8px 10px; }
            .admin-actions { flex-direction: column; }
            .admin-actions .btn { width: 100%; justify-content: center; }
        }
    </style>
</head>
<body>

    <div class="admin-panel">
        <div class="sidebar-skeleton" aria-hidden="true">
            <div class="skel-logo"></div>
            <div class="skel-line" style="width:70%;margin:0 auto 24px;"></div>
            <div class="skel-line"></div>
            <div class="skel-line"></div>
            <div class="skel-line"></div>
            <div class="skel-line"></div>
            <div class="skel-line"></div>
        </div>

        <aside class="admin-sidebar" id="adminSidebar">
            <div class="logo">
                <img src="images/new-logo.png" alt="ISSE Logo">
                <h3>ISSE Academy</h3>
                <p>Academic Management System</p>
            </div>

            <!-- Academy Panel links (visible to all logged-in Academy roles) -->
            <a href="#" class="nav-item active" id="navDashboard">
                <img src="icons/dashboard-icon.png" alt="Dashboard" class="icon"> Dashboard
            </a>
            <a href="#" class="nav-item" id="navStudents">
                <img src="icons/students-icon.png" alt="Students" class="icon"> Students
            </a>
            <a href="#" class="nav-item" id="navStaff">
                <img src="icons/admins-icon.png" alt="Staff" class="icon"> Staff
            </a>
            <a href="#" class="nav-item" id="navCourses">
                <img src="icons/courses-icon.png" alt="Courses" class="icon"> Courses
            </a>
            <a href="#" class="nav-item" id="navMyCourses">
                <img src="icons/my-courses-icon.png" alt="My Courses" class="icon"> My Courses
            </a>
            <a href="#" class="nav-item" id="navEnquiries">
                <img src="icons/enquiries-icon.png" alt="Enquiries" class="icon"> Enquiries
            </a>
            <a href="#" class="nav-item" id="navAudit">
                <img src="icons/audit-icon.png" alt="Audit" class="icon"> Audit Log
            </a>
            <a href="#" class="nav-item" id="navAdmins">
                <img src="icons/admins-icon.png" alt="Admin Management" class="icon"> Admin Management
            </a>

            <!-- Return to main admin (Super Admin only) -->
            <a href="admin-dashboard.html" class="nav-item" id="navMainAdmin">
                <img src="icons/dashboard-icon.png" alt="Main Admin" class="icon"> Main Admin
            </a>

            <a href="#" class="nav-item logout" id="logoutBtn">
                <img src="icons/logout-icon.png" alt="Logout" class="icon"> Logout
            </a>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button class="admin-hamburger" id="adminHamburger">
                        <span></span><span></span><span></span>
                    </button>
                    <h1 id="pageTitle">🎓 Academy Dashboard</h1>
                </div>
                <div class="admin-info">
                    <button class="dark-toggle" id="darkToggle" aria-label="Toggle dark mode">
                        <img src="icons/moon-icon.png" alt="Dark Mode" id="darkIcon">
                    </button>
                    <div class="admin-dropdown">
                        <button class="admin-dropdown-btn" id="adminDropdownBtn">
                            <span id="adminNameDisplay">Admin</span>
                            <span class="role-badge" id="adminRoleDisplay">Super Admin</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="admin-dropdown-menu" id="adminDropdownMenu">
                                                        <a href="academy-profile.html" class="dropdown-item">
                                <span>👤</span> Profile
                            </a>
                            <hr class="dropdown-divider">
                            <a href="#" class="dropdown-item" id="logoutDropdownBtn">
                                <span>🚪</span> Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <!-- DYNAMIC CONTENT AREA -->
            <div id="contentArea">
                <!-- Rendered by JavaScript -->
            </div>
        </main>
    </div>

    <!-- MODAL CONTAINER (shared) -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-box" id="modalContent">
            <!-- Rendered by JavaScript -->
        </div>

    <script src="supabase-config.js"></script>
    <script>

        let currentAdmin = null;
        let currentView = 'dashboard';
        let allStudents = [];
        let allStaff = [];
        let allCourses = [];
        let allEnquiries = [];
        let allEnrollments = [];
        let allAuditLogs = [];
        let editId = null;
        let isDirty = false;

                const PROGRAMS = ['Space Physics', 'Geoinformatics and GIS', 'Aerospace Engineering', 'Systems Engineering'];
        const DEGREES = ['MSc', 'PhD'];

                const STAFF_TITLES = ['Dr.', 'Mr.', 'Mrs.', 'Miss'];
        const STAFF_GENDERS = ['Male', 'Female'];

        const ALLOWED_ROLES = ['Super Admin', 'Head of Academic Staff', 'Academic Staff', 'Lecturer'];

        // ==================== SESSION CHECK ====================
        initDarkModeToggle();

        (async function() {
            currentAdmin = await getCurrentAdmin();

            if (!currentAdmin) {
                window.location.replace('academy-login.html');
                return;
            }

            // Check if user has an Academy role
            if (!ALLOWED_ROLES.includes(currentAdmin.role)) {
                await db.auth.signOut();
                window.location.replace('academy-login.html');
                return;
            }

            if (currentAdmin.is_active === false) {
                await db.auth.signOut();
                window.location.replace('academy-login.html');
                return;
            }

            document.getElementById('adminNameDisplay').textContent = currentAdmin.username;
            document.getElementById('adminRoleDisplay').textContent = currentAdmin.role;
            document.body.classList.add('nav-ready');

            // Show/hide sidebar items based on role
            const role = currentAdmin.role;
            const isSuper = role === 'Super Admin';
            const isHoAS = role === 'Head of Academic Staff';
            const isAcademic = role === 'Academic Staff';
            const isLecturer = role === 'Lecturer';

            document.getElementById('navStaff').style.display = (isSuper || isHoAS) ? 'flex' : 'none';
            document.getElementById('navCourses').style.display = (isSuper || isHoAS || isAcademic) ? 'flex' : 'none';
            document.getElementById('navMyCourses').style.display = isLecturer ? 'flex' : 'none';
            document.getElementById('navEnquiries').style.display = (isSuper || isHoAS || isAcademic) ? 'flex' : 'none';
            document.getElementById('navAudit').style.display = isSuper ? 'flex' : 'none';
            document.getElementById('navAdmins').style.display = isSuper ? 'flex' : 'none';

            await loadAllData();

            // Show dashboard by default
            showDashboard();

        // ==================== LOAD DATA ====================
        async function loadAllData() {
            try {
                // Load students
                const { data: students } = await db
                    .from('students')
                    .select('*')
                    .order('created_at', { ascending: false });
                allStudents = students || [];

                // Load staff
                const { data: staff } = await db
                    .from('staff')
                    .select('*')
                    .order('created_at', { ascending: false });
                allStaff = staff || [];

                // Load courses
                const { data: courses } = await db
                    .from('courses')
                    .select('*')
                    .order('created_at', { ascending: false });
                allCourses = courses || [];

                // Load enrollments
                const { data: enrollments } = await db
                    .from('enrollments')
                    .select('*')
                    .order('created_at', { ascending: false });
                allEnrollments = enrollments || [];

                // Load enquiries
                const { data: enquiries } = await db
                    .from('academic_enquiries')
                    .select('*')
                    .order('created_at', { ascending: false });
                allEnquiries = enquiries || [];

                // Load audit logs (Super Admin only)
                if (currentAdmin.role === 'Super Admin') {
                    const { data: audit } = await db
                        .from('activity_log')
                        .select('*')
                        .order('created_at', { ascending: false })
                        .limit(200);
                    allAuditLogs = audit || [];
                }

            } catch (error) {
                console.error('Error loading data:', error);
            }

                    case 'navStudents': showStudents(); break;
                    case 'navStaff': showStaff(); break;
                    case 'navCourses': showCourses(); break;
                    case 'navMyCourses': showMyCourses(); break;
                    case 'navEnquiries': showEnquiries(); break;
                    case 'navAudit': showAudit(); break;
                    case 'navAdmins': showAdminManagement(); break;
                }
            });
        });

        // ==================== DASHBOARD ====================
        function showDashboard() {
            currentView = 'dashboard';
            document.getElementById('pageTitle').textContent = '🎓 Academy Dashboard';

            const totalStudents = allStudents.length;
            const totalStaff = allStaff.length;
            const totalCourses = allCourses.length;
            const totalEnrollments = allEnrollments.length;
                        const activeStudents = allStudents.filter(s => s.status === 'Active').length;

            // Count students per program
            const progCounts = {};
            allStudents.forEach(s => {
                const prog = s.program || 'Unknown';
                progCounts[prog] = (progCounts[prog] || 0) + 1;
            });

            let deptRows = '';
            Object.keys(progCounts).forEach(prog => {
                deptRows += `<tr><td>${escapeHtml(prog)}</td><td><strong>${progCounts[prog]}</strong></td></tr>`;
            });
                        if (!deptRows) deptRows = '<tr><td colspan="2" style="text-align:center;color:#7F8C8D;">No students enrolled yet</td></tr>';
            const container = document.getElementById('contentArea');
            container.innerHTML = `
                <div class="stats-grid-admin">
                    <div class="stat-card-admin">
                        <div class="number">${totalStudents}</div>
                        <div class="label">Total Students</div>
                    </div>
                    <div class="stat-card-admin">
                        <div class="number">${activeStudents}</div>
                        <div class="label">Active Students</div>
                    </div>
                    <div class="stat-card-admin">
                        <div class="number">${totalCourses}</div>
                        <div class="label">Total Courses</div>
                    </div>
                    <div class="stat-card-admin">
                        <div class="number">${totalEnrollments}</div>
                        <div class="label">Total Enrollments</div>
                    </div>

                    <div class="admin-table-wrapper">

                            <thead><tr><th>Program</th><th>Count</th></tr></thead>
                            <tbody>${deptRows}</tbody>
                        </table>
                    </div>
                    <div class="admin-table-wrapper">
                        <h3 style="margin-bottom:15px;">📚 Recent Activity</h3>
                        <div id="recentActivity">
                            ${allAuditLogs.length > 0 ? allAuditLogs.slice(0, 5).map(log => `
                                <div style="padding:10px 0; border-bottom:1px solid #F5F7FA; font-size:14px;">
                                    <span>${escapeHtml(log.action)}</span>
                                    <span style="float:right;color:#7F8C8D;font-size:12px;">${formatTimestamp(log.created_at)}</span>
                                </div>

                </div>

        }    

                // ==================== STUDENTS ====================
        let studentFilters = { programs: [], degrees: [] };
                let staffFilters = { genders: [] };
    

                function showStudents() {
            currentView = 'students';
            document.getElementById('pageTitle').textContent = '👨‍🎓 Students';

            const isSuperOrHoAS = currentAdmin.role === 'Super Admin' || currentAdmin.role === 'Head of Academic Staff';
            const isReadOnly = currentAdmin.role === 'Academic Staff';

            let actionsHtml = '';
            if (isSuperOrHoAS) {
                actionsHtml = `
                    <div class="admin-actions">
                        <button class="btn btn-primary" onclick="openStudentModal()">
                            <img src="icons/add-icon.png" alt="Add"> Add Student
                        </button>
                        <button class="btn btn-primary" onclick="importStudents()">📤 Bulk Import</button>
                        <button class="btn btn-primary" onclick="exportStudents()">⬇️ Download CSV</button>
                    </div>
                `;
            } else if (isReadOnly) {

                    <div class="admin-actions">
                        <p style="color:#7F8C8D;font-size:14px;margin:0;">👁️ View-only mode.</p>
                        <button class="btn btn-primary" onclick="exportStudents()">⬇️ Download CSV</button>
                    </div>
                `;

            const container = document.getElementById('contentArea');
            container.innerHTML = `
                ${actionsHtml}

                    <select id="studentProgramFilter" onchange="applyStudentFilters()">
                        <option value="">All Programs</option>

                    </select>
                    <input type="text" id="studentNameFilter" placeholder="Search name..." oninput="applyStudentFilters()">
                    <input type="text" id="studentIdFilter" placeholder="Search student ID..." oninput="applyStudentFilters()">
                    <input type="text" id="studentYearFilter" placeholder="Search year..." oninput="applyStudentFilters()">
                    <div class="filter-dropdown">
                        <button type="button" class="filter-dropdown-btn" onclick="document.getElementById('studentFilterPanel').classList.toggle('open')">
                            🔎 More Filters ${(studentFilters.programs.length + studentFilters.degrees.length) ? `(${studentFilters.programs.length + studentFilters.degrees.length})` : ''}

                            <h4>Program</h4>

                            ${DEGREES.map(d => `
                                <label class="filter-check-row">
                                    <input type="checkbox" value="${d}" class="student-filter-degree" ${studentFilters.degrees.includes(d) ? 'checked' : ''}> ${d}

                            <div class="filter-panel-actions">
                                <button type="button" class="btn btn-primary" onclick="applyStudentFilters()">Apply</button>
                                <button type="button" class="btn btn-cancel" onclick="clearStudentFilters()">Clear</button>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="admin-table-wrapper">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>#</th>
                                <th>Full Name</th>
                                <th>Student ID</th>
                                <th>Program</th>
                                <th>Degree</th>
                                <th>Status</th>
                                <th>Actions</th>
                            </tr>
                        </thead>

        function renderStudentRows(list) {
            const isSuperOrHoAS = currentAdmin.role === 'Super Admin' || currentAdmin.role === 'Head of Academic Staff';
            const tbody = document.getElementById('studentTableBody');
            if (!tbody) return;

            const rows = list.map((s, i) => `
                <tr>
                    <td>${i + 1}</td>
                    <td><strong>${escapeHtml(s.full_name)}</strong></td>
                    <td>${escapeHtml(s.student_id || 'N/A')}</td>
                    <td>${escapeHtml(s.program || 'N/A')}</td>
                    <td>${escapeHtml(s.degree || 'N/A')}</td>
                    <td><span class="${s.status === 'Active' ? 'status-active' : 'status-inactive'}">${escapeHtml(s.status || 'Active')}</span></td>
                    <td>
                        <div class="actions">
                            <button class="btn-small btn-view" onclick="viewStudent('${s.id}')">👁️</button>
                            ${isSuperOrHoAS ? `<button class="btn-small btn-edit" onclick="openStudentModal('${s.id}')">✏️</button>` : ''}
                            ${isSuperOrHoAS ? `<button class="btn-small btn-delete" onclick="deleteStudent('${s.id}')">🗑️</button>` : ''}
                        </div>
                    </td>
                </tr>
            `).join('');

            tbody.innerHTML = rows || '<tr><td colspan="7"><div class="empty-state"><p>No students found.</p></div></td></tr>';
        }

        function applyStudentFilters() {
            studentFilters.programs = Array.from(document.querySelectorAll('.student-filter-program:checked')).map(el => el.value);
            studentFilters.degrees = Array.from(document.querySelectorAll('.student-filter-degree:checked')).map(el => el.value);

            const dropdownProgram = document.getElementById('studentProgramFilter')?.value || '';
            const name = (document.getElementById('studentNameFilter')?.value || '').toLowerCase();
            const sid = (document.getElementById('studentIdFilter')?.value || '').toLowerCase();
            const year = (document.getElementById('studentYearFilter')?.value || '').toLowerCase();

            const filtered = allStudents.filter(s => {
                if (dropdownProgram && s.program !== dropdownProgram) return false;
                if (studentFilters.programs.length && !studentFilters.programs.includes(s.program)) return false;
                if (studentFilters.degrees.length && !studentFilters.degrees.includes(s.degree)) return false;
                if (name && !(s.full_name || '').toLowerCase().includes(name)) return false;
                if (sid && !(s.student_id || '').toLowerCase().includes(sid)) return false;
                if (year && !(s.year_of_enrollment || '').toLowerCase().includes(year)) return false;
                return true;
            });

            renderStudentRows(filtered);
        }

        function clearStudentFilters() {
            studentFilters = { programs: [], degrees: [] };
            document.getElementById('studentProgramFilter').value = '';
            document.getElementById('studentNameFilter').value = '';
            document.getElementById('studentIdFilter').value = '';
            document.getElementById('studentYearFilter').value = '';
            document.querySelectorAll('.student-filter-program, .student-filter-degree').forEach(el => el.checked = false);
            renderStudentRows(allStudents);
            document.getElementById('studentFilterPanel').classList.remove('open');
        }

        function getFilteredStudents() {
            const dropdownProgram = document.getElementById('studentProgramFilter')?.value || '';
            const name = (document.getElementById('studentNameFilter')?.value || '').toLowerCase();
            const sid = (document.getElementById('studentIdFilter')?.value || '').toLowerCase();
            const year = (document.getElementById('studentYearFilter')?.value || '').toLowerCase();

            return allStudents.filter(s => {
                if (dropdownProgram && s.program !== dropdownProgram) return false;
                if (studentFilters.programs.length && !studentFilters.programs.includes(s.program)) return false;
                if (studentFilters.degrees.length && !studentFilters.degrees.includes(s.degree)) return false;
                if (name && !(s.full_name || '').toLowerCase().includes(name)) return false;
                if (sid && !(s.student_id || '').toLowerCase().includes(sid)) return false;
                if (year && !(s.year_of_enrollment || '').toLowerCase().includes(year)) return false;
                return true;
            });
        }

        function exportStudents() {
            const list = getFilteredStudents();
            const headers = ['Full Name', 'Gender', 'Student ID', 'Program', 'Degree', 'Next of Kin', 'Year of Enrollment', 'Email', 'Phone', 'Status'];
            const rows = list.map(s => [
                s.full_name, s.gender, s.student_id, s.program, s.degree,
                s.next_of_kin, s.year_of_enrollment, s.email, s.phone, s.status
            ]);
            downloadCsv('students.csv', headers, rows);
        }

        function downloadCsv(filename, headers, rows) {
            const escapeCsv = (val) => {
                const str = (val === null || val === undefined) ? '' : String(val);
                return /[",\n]/.test(str) ? '"' + str.replace(/"/g, '""') + '"' : str;
            };
            const lines = [headers.map(escapeCsv).join(',')].concat(
                rows.map(r => r.map(escapeCsv).join(','))
            );
            const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            a.click();
            URL.revokeObjectURL(url);
        }

        function renderStaffRows(list) {

                // --- BULK IMPORT STAFF ---

                async function processStaffImport() {
            const data = document.getElementById('staffImportData').value.trim();
            const msgEl = document.getElementById('staffImportMessage');

            if (!data) {
                msgEl.className = 'message error';
                msgEl.textContent = 'Please paste staff data.';
                return;
            }

            const lines = data.split('\n').map(l => l.trim()).filter(Boolean);
            let added = 0;
            let failed = 0;
            let errors = [];

            for (const line of lines) {
                // Try splitting by tabs first, then semicolons, then commas
                let parts;
                if (line.includes('\t')) {
                    parts = line.split('\t');
                } else if (line.includes(';')) {
                    parts = line.split(';');
                } else {
                    parts = line.split(',');
                }
                parts = parts.map(p => p.trim());

                // Skip empty lines
                if (parts.length === 0 || (parts.length === 1 && parts[0] === '')) {
                    continue;
                }

                // Debug: log the first few lines to see what's happening
                if (lines.indexOf(line) < 5) {
                    console.log('Line:', line);
                    console.log('Parts:', parts);
                    console.log('Parts length:', parts.length);
                }

                // We need at least Title and Name (2 columns)
                if (parts.length < 2) {
                    failed++;
                    errors.push(`❌ Line ${lines.indexOf(line) + 1}: Not enough columns (got ${parts.length}, need at least 2). Raw: "${line}"`);
                    continue;
                }

                const [
                    title = '',
                    name = '',
                    isse_file_no = '',
                    nasrda_file_no = '',
                    ippis = '',
                    designation = '',
                    gender = ''
                ] = parts;

                if (!name) {
                    failed++;
                    errors.push(`❌ Line ${lines.indexOf(line) + 1}: Missing name. Raw: "${line}"`);
                    continue;
                }

                // Validate title (optional)
                const validTitles = ['Dr.', 'Mr.', 'Mrs.', 'Miss'];
                const validTitle = validTitles.includes(title) ? title : '';

                // Validate gender (optional)
                const validGenders = ['Male', 'Female'];
                const validGender = validGenders.includes(gender) ? gender : '';

                try {
                    const { error } = await db.from('staff').insert([{
    title: validTitle || null,
    full_name: name,   // <-- changed from 'name' to 'full_name'
    isse_file_no: isse_file_no || null,
    nasrda_file_no: nasrda_file_no || null,
    ippis: ippis || null,
    designation: designation || null,
    gender: validGender || null
}]);
                    if (error) throw error;
                    added++;
                } catch (error) {
                    failed++;
                    errors.push(`❌ Line ${lines.indexOf(line) + 1} (${name}): ${error.message}`);
                }
            }

            await logActivity(`Imported ${added} staff via bulk import`, currentAdmin);
            await loadAllData();

            // Show detailed results
            let resultMessage = `✅ ${added} staff added. ${failed} failed.`;
            if (errors.length > 0) {
                // Show first 20 errors in the message
                const errorList = errors.slice(0, 20).join('\n');
                const moreErrors = errors.length > 20 ? `\n... and ${errors.length - 20} more errors.` : '';
                resultMessage += `\n\nDetails:\n${errorList}${moreErrors}`;
                // Put in textarea so it's scrollable
                msgEl.innerHTML = resultMessage.replace(/\n/g, '<br>');
                msgEl.style.maxHeight = '300px';
                msgEl.style.overflowY = 'auto';
            } else {
                msgEl.textContent = resultMessage;
            }
            msgEl.className = 'message success';

            if (added > 0) {
                setTimeout(() => {
                    closeModal();
                    showStaff();
                }, 3000);
            }
        }

                async function saveStudent() {
            const id = document.getElementById('studentRecordId').value;
            const full_name = document.getElementById('studentFullName').value.trim();
            const gender = document.getElementById('studentGender').value;
            const student_id = document.getElementById('studentIdInput').value.trim();
            const program = document.getElementById('studentProgram').value;
            const degree = document.getElementById('studentDegree').value;
            const next_of_kin = document.getElementById('studentNextOfKin').value.trim();
            const year_of_enrollment = document.getElementById('studentYear').value.trim();
            const email = document.getElementById('studentEmail').value.trim();
            const phone = document.getElementById('studentPhone').value.trim();
            const status = document.getElementById('studentStatus').value;
            const msgEl = document.getElementById('studentFormMessage');
            const imageFile = document.getElementById('studentProfileImage').files[0];
            const currentImageUrl = document.getElementById('studentCurrentImageUrl').value;

            if (!full_name || !student_id) {
                msgEl.className = 'message error';
                msgEl.textContent = 'Full Name and Student ID are required.';
                return;
            }

            try {
                let imageUrl = currentImageUrl || null;

                // If a new image was selected, upload it
                if (imageFile) {
                    // Check file size (max 2MB)
                    if (imageFile.size > 2 * 1024 * 1024) {
                        msgEl.className = 'message error';
                        msgEl.textContent = 'Image must be smaller than 2MB.';
                        return;
                    }
                    
                    // Delete old image if it exists
                    if (currentImageUrl) {
                        try {
                            const oldPath = currentImageUrl.split('/').pop();
                            await db.storage.from('profile-images').remove([oldPath]);
                        } catch (e) {
                            console.warn('Could not delete old image:', e);
                        }
                    }

                    // Upload new image
                    const fileExt = imageFile.name.split('.').pop();
                    const fileName = `student-${Date.now()}.${fileExt}`;
                    const { error: uploadError } = await db.storage
                        .from('profile-images')
                        .upload(fileName, imageFile);
                    
                    if (uploadError) throw uploadError;
                    
                    const { data: urlData } = db.storage
                        .from('profile-images')
                        .getPublicUrl(fileName);
                    
                    imageUrl = urlData.publicUrl;
                }

                const payload = { 
                    full_name, gender, student_id, program, degree, 
                    next_of_kin, year_of_enrollment, email, phone, status,
                    profile_image_url: imageUrl
                };

                if (id) {
                    const { error } = await db.from('students').update(payload).eq('id', id);
                    if (error) throw error;
                    await logActivity('Updated Student: ' + full_name, currentAdmin, { id });
                } else {
                    const { error } = await db.from('students').insert([payload]);
                    if (error) throw error;
                    await logActivity('Added Student: ' + full_name, currentAdmin);
                }

                closeModal();
                await loadAllData();
                showStudents();

            } catch (error) {
                console.error('Error saving student:', error);
                msgEl.className = 'message error';
                msgEl.textContent = '❌ Error: ' + error.message;
            }

                console.error('Error creating admin:', error);
                msgEl.className = 'message error';
                msgEl.textContent = '❌ Error: ' + error.message;
            }
        }
                function previewStudentImage(input) {
            const preview = document.getElementById('studentImagePreview');
            const img = document.getElementById('studentImagePreviewImg');
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    img.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            } else {
                preview.style.display = 'none';
            }
        }

        async function deleteAdminAccount(id) {
            if (!confirm('Are you sure you want to delete this admin account?')) return;
            try {
                await deleteAdmin(id);
                await logActivity('Deleted Admin Account', currentAdmin);
                showAdminManagement();
            } catch (error) {
                console.error('Error deleting admin:', error);
                alert('Error deleting admin: ' + error.message);
            }
        }

        // --- BULK IMPORT STUDENTS ---
                function importStudents() {
            const modal = document.getElementById('modalOverlay');
            const content = document.getElementById('modalContent');

            content.innerHTML = `
                <h2>📤 Bulk Import Students</h2>
                <p style="color:#7F8C8D;font-size:14px;margin-bottom:15px;">
                    Paste rows copied straight from Excel, or comma-separated text. One student per line.<br>
                    Column order: <strong>Full Name, Gender, Student ID, Program, Degree, Next of Kin, Year of Enrollment, Email, Phone, Status</strong>
                    (Status is optional — defaults to Active).
                </p>
                <form id="importForm">
                    <div class="form-group">
                        <label for="importData">Student Data</label>
                        <textarea id="importData" rows="8" placeholder="John Doe	Male	MSC001	Space Physics	MSc	Jane Doe	2024	john@example.com	08012345678" required></textarea>
                        <small style="color:#7F8C8D;">Programs: ${PROGRAMS.join(', ')}</small>
                    </div>
                    <div id="importMessage" class="message"></div>
                    <div class="modal-actions">
                        <button type="submit" class="btn btn-primary">📤 Import Students</button>
                        <button type="button" class="btn btn-cancel" onclick="closeModal()">Cancel</button>
                    </div>
                </form>
            `;

            modal.classList.add('visible');

            document.getElementById('importForm').addEventListener('submit', async function(e) {
                e.preventDefault();
                await processStudentImport();
            });
        }

                function splitImportLine(line) {
            // Support tabs (Excel paste), commas, and semicolons
            if (line.includes('\t')) return line.split('\t');
            if (line.includes(';')) return line.split(';');
            return line.split(',');
        }

        async function processStudentImport() {
            const data = document.getElementById('importData').value.trim();
            const msgEl = document.getElementById('importMessage');

            if (!data) {
                msgEl.className = 'message error';
                msgEl.textContent = 'Please paste student data.';
                return;
            }

            const lines = data.split('\n').map(l => l.trim()).filter(Boolean);
            let added = 0;
            let failed = 0;
            let errors = [];

            for (const line of lines) {
                const parts = splitImportLine(line).map(p => p.trim());
                if (parts.length < 3) {
                    failed++;
                    errors.push('Invalid line: ' + line);
                    continue;
                }

                const [
                    full_name, gender, student_id,
                    program = PROGRAMS[0], degree = 'MSc',
                    next_of_kin = '', year_of_enrollment = '',
                    email = '', phone = '', status = 'Active'
                ] = parts;

                try {
                    const { error } = await db.from('students').insert([{
                        full_name, gender, student_id, program, degree,
                        next_of_kin, year_of_enrollment, email, phone,
                        status: status || 'Active'
                    }]);
                    if (error) throw error;
                    added++;
                } catch (error) {
                    failed++;
                    errors.push(`${full_name}: ${error.message}`);
                }
            }

            await logActivity(`Imported ${added} students via bulk import`, currentAdmin);
            await loadAllData();

            msgEl.className = 'message success';
            msgEl.textContent = `✅ ${added} students added. ${failed} failed.`;

            if (errors.length > 0 && errors.length <= 5) {
                msgEl.textContent += ' Errors: ' + errors.join('; ');
            }

            if (added > 0) {
                setTimeout(() => {
                    closeModal();
                    showStudents();
                }, 1500);
            }
        }

        // --- AUDIT FILTER ---
        function filterAudit() {
            const search = document.getElementById('auditSearch').value.toLowerCase();
            const rows = document.querySelectorAll('#auditTableBody tr');
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                row.style.display = text.includes(search) ? '' : 'none';
            });
        }

        async function refreshAudit() {
            const { data } = await db
                .from('activity_log')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(200);
            allAuditLogs = data || [];
            showAudit();
        }

        // ==================== UTILITY FUNCTIONS ====================

        function escapeHtml(value) {
            if (value === null || value === undefined) return '';
            return String(value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function formatTimestamp(value) {
            if (!value) return '';
            return new Date(value).toLocaleString('en-US', {
                month: 'short',
                day: 'numeric',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit'
            });
        }

        function closeModal() {
            document.getElementById('modalOverlay').classList.remove('visible');
        }

        document.getElementById('modalOverlay').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ==================== HAMBURGER TOGGLE ====================
        document.getElementById('adminHamburger').addEventListener('click', function() {
            document.getElementById('adminSidebar').classList.toggle('open');
        });

        // ==================== LOGOUT ====================
        document.getElementById('logoutBtn').addEventListener('click', async function(e) {
            e.preventDefault();
            await logActivity('Academy Logout', currentAdmin, {});
            await db.auth.signOut();
            window.location.replace('academy-login.html');
        });

        document.getElementById('logoutDropdownBtn').addEventListener('click', async function(e) {
            e.preventDefault();
            await logActivity('Academy Logout', currentAdmin, {});
            await db.auth.signOut();
            window.location.replace('academy-login.html');
        });

        // ==================== ADMIN DROPDOWN ====================
        const dropdownBtn = document.getElementById('adminDropdownBtn');
        const dropdownMenu = document.getElementById('adminDropdownMenu');

        if (dropdownBtn && dropdownMenu) {
            dropdownBtn.addEventListener('click', function(e) {
                e.stopPropagation();
                this.classList.toggle('active');
                dropdownMenu.classList.toggle('show');
            });

            document.addEventListener('click', function(e) {
                if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
                    dropdownBtn.classList.remove('active');
                    dropdownMenu.classList.remove('show');
                }
            });
        }

                // ==================== MAKE FUNCTIONS GLOBAL FOR INLINE ONCLICK ====================
        window.openStudentModal = openStudentModal;
        window.openStaffModal = openStaffModal;
        window.openCourseModal = openCourseModal;
        window.openAdminModal = openAdminModal;
        window.deleteStudent = deleteStudent;
        window.deleteStaff = deleteStaff;
        window.deleteCourse = deleteCourse;
        window.deleteEnquiry = deleteEnquiry;
        window.deleteAdminAccount = deleteAdminAccount;
        window.viewStudent = viewStudent;
        window.viewStaff = viewStaff;
        window.viewEnquiry = viewEnquiry;
        window.sendEnquiryReply = sendEnquiryReply;
                window.importStudents = importStudents;
        window.importStaff = importStaff;
        window.exportStudents = exportStudents;
        window.exportStaff = exportStaff;
        window.applyStudentFilters = applyStudentFilters;
        window.clearStudentFilters = clearStudentFilters;
        window.applyStaffFilters = applyStaffFilters;
        window.clearStaffFilters = clearStaffFilters;
        window.filterAudit = filterAudit;
        window.refreshAudit = refreshAudit;
        window.closeModal = closeModal;
        window.previewStudentImage = previewStudentImage;
        window.previewStaffImage = previewStaffImage;
    </script>
