<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Password - ISSE Admin</title>
    <link rel="icon" type="image/png" href="images/new-logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .admin-login-page {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #0B1A3A 0%, #1A2A5A 100%);
            padding: 20px;
        }
        .admin-login-box {
            background: #FFFFFF;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 420px;
        }
        .admin-login-box .logo {
            text-align: center;
            margin-bottom: 30px;
        }
        .admin-login-box .logo img {
            height: 60px;
            width: auto;
            margin: 0 auto 10px;
        }
        .admin-login-box .logo h2 {
            font-size: 22px;
            color: #0B1A3A;
            margin-bottom: 5px;
        }
        .admin-login-box .logo p {
            font-size: 14px;
            color: #7F8C8D;
            margin: 0;
        }
        .admin-login-box .form-group {
            margin-bottom: 20px;
        }
        .admin-login-box .form-group label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #0B1A3A;
            margin-bottom: 5px;
        }
        .admin-login-box .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #E8ECF0;
            border-radius: 8px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            transition: border-color 0.3s ease;
        }
        .admin-login-box .password-field-wrapper input {
            padding-right: 44px;
        }
        .admin-login-box .form-group input:focus {
            outline: none;
            border-color: #D4A843;
            box-shadow: 0 0 0 3px rgba(212,168,67,0.1);
        }
        .admin-login-box .btn {
            width: 100%;
            padding: 14px;
            font-size: 16px;
        }
        .admin-login-box .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        .admin-login-box .back-link {
            display: block;
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
            color: #7F8C8D;
            transition: color 0.3s ease;
        }
        .admin-login-box .back-link:hover {
            color: #D4A843;
        }
        .message {
            padding: 10px 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }
        .message.error {
            display: block;
            background: #FDE8E8;
            color: #E74C3C;
            border-left: 4px solid #E74C3C;
        }
        .message.success {
            display: block;
            background: #E8F8F0;
            color: #27AE60;
            border-left: 4px solid #27AE60;
        }
        .loading-spinner {
            display: none;
            text-align: center;
            margin-top: 15px;
        }
        .loading-spinner.visible {
            display: block;
        }
        .spinner {
            display: inline-block;
            width: 30px;
            height: 30px;
            border: 3px solid #E8ECF0;
            border-top: 3px solid #D4A843;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="admin-login-page">
        <div class="admin-login-box">
            <div class="logo">
                <img src="images/new-logo.png" alt="ISSE Logo">
                <h2>Set New Password</h2>
                <p>Enter your new password below</p>
            </div>

            <div id="message" class="message"></div>

            <form id="updatePasswordForm">
                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="newPassword" placeholder="Enter new password" required>
                        <button type="button" class="password-toggle-btn" aria-label="Show password"></button>
                    </div>
                </div>
                <div class="form-group">
                    <label for="confirmPassword">Confirm New Password</label>
                    <div class="password-field-wrapper">
                        <input type="password" id="confirmPassword" placeholder="Confirm new password" required>
                        <button type="button" class="password-toggle-btn" aria-label="Show password"></button>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary" id="updateBtn">Update Password</button>
            </form>

            <div class="loading-spinner" id="loadingSpinner">
                <div class="spinner"></div>
                <p style="margin-top: 10px; color: #7F8C8D; font-size: 14px;">Updating password...</p>
            </div>

            <a href="admin-login.html" class="back-link">← Back to Login</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script>
        const form = document.getElementById('updatePasswordForm');
        const message = document.getElementById('message');
        const updateBtn = document.getElementById('updateBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');

        form.addEventListener('submit', async function(e) {
            e.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            // Clear previous messages
            message.className = 'message';
            message.textContent = '';

            // Validate
            if (newPassword.length < 6) {
                message.className = 'message error';
                message.textContent = 'Password must be at least 6 characters.';
                return;
            }

            if (newPassword !== confirmPassword) {
                message.className = 'message error';
                message.textContent = 'Passwords do not match.';
                return;
            }

            updateBtn.disabled = true;
            loadingSpinner.classList.add('visible');

            try {
                // Update the password using Supabase Auth
                const { error } = await db.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                message.className = 'message success';
                message.textContent = '✅ Password updated successfully! Redirecting to login...';
                updateBtn.disabled = true;

                // Redirect to login after 3 seconds
                setTimeout(() => {
                    window.location.href = 'admin-login.html?updated=true';
                }, 3000);

            } catch (error) {
                console.error('Error updating password:', error);
                message.className = 'message error';
                message.textContent = 'Error: ' + (error.message || 'Failed to update password. Please try again.');
                updateBtn.disabled = false;
                loadingSpinner.classList.remove('visible');
            }
        });
    </script>
</body>
</html>
