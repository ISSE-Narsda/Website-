<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Messages - ISSE Admin</title>
    <link rel="icon" type="image/png" href="images/new-logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .admin-panel { display: flex; min-height: 100vh; background-color: #F5F7FA; }
        .admin-sidebar { width: 260px; background-color: #0B1A3A; color: #FFFFFF; padding: 20px 0; position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; z-index: 1000; transition: transform 0.3s ease; }
        .admin-sidebar .logo { padding: 0 20px 20px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 20px; text-align: center; }
        .admin-sidebar .logo img { height: 45px; width: auto; margin: 0 auto 8px; }
        .admin-sidebar .logo h3 { font-size: 16px; color: #FFFFFF; margin: 0; }
        .admin-sidebar .logo p { font-size: 12px; color: #B0C4DE; margin: 0; }
        .admin-sidebar .nav-item { display: flex; align-items: center; gap: 12px; padding: 12px 20px; color: #B0C4DE; text-decoration: none; transition: all 0.3s ease; border-left: 3px solid transparent; font-size: 14px; font-weight: 500; }
        .admin-sidebar .nav-item:hover { background-color: rgba(255,255,255,0.05); color: #FFFFFF; }
        .admin-sidebar .nav-item.active { background-color: rgba(212,168,67,0.1); color: #D4A843; border-left-color: #D4A843; }
        .admin-sidebar .nav-item .icon { width: 24px; height: 24px; object-fit: contain; flex-shrink: 0; }
        .admin-sidebar .nav-item.logout { margin-top: 30px; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 20px; }
        .admin-sidebar .nav-item.logout .icon { filter: brightness(0) saturate(100%) invert(48%) sepia(71%) saturate(423%) hue-rotate(340deg) brightness(95%) contrast(94%); }
        .admin-sidebar .nav-item.logout:hover { background-color: rgba(231,76,60,0.1); }
        .admin-main { margin-left: 260px; padding: 30px; flex: 1; }
        .admin-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 1px solid #E8ECF0; }
        .admin-header h1 { font-size: 28px; color: #0B1A3A; margin: 0; }
        .admin-header .admin-info { display: flex; align-items: center; gap: 15px; font-size: 14px; color: #2C3E50; }
        .admin-header .admin-info .role-badge { background-color: #D4A843; color: #0B1A3A; padding: 4px 12px; border-radius: 20px; font-weight: 600; font-size: 12px; }
        .admin-hamburger { display: none; flex-direction: column; gap: 5px; cursor: pointer; padding: 5px; background: none; border: none; }
        .admin-hamburger span { display: block; width: 25px; height: 3px; background-color: #0B1A3A; border-radius: 3px; }

        .admin-table-wrapper { background: #FFFFFF; border-radius: 12px; padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.06); overflow-x: auto; }
        .admin-table { width: 100%; border-collapse: collapse; font-size: 14px; }
        .admin-table th { background-color: #F5F7FA; padding: 12px 15px; text-align: left; font-weight: 600; color: #0B1A3A; border-bottom: 2px solid #E8ECF0; }
        .admin-table td { padding: 12px 15px; border-bottom: 1px solid #F5F7FA; color: #2C3E50; }
        .admin-table tr:hover { background-color: #FAFBFC; }
        .admin-table .message-preview { max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .admin-table .actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
        .admin-table .btn-small { padding: 6px 10px; font-size: 12px; border-radius: 6px; border: none; cursor: pointer; transition: all 0.3s ease; display: flex; align-items: center; gap: 4px; }
        .admin-table .btn-small img { width: 14px; height: 14px; object-fit: contain; }
        
        .btn-delete { 
            background-color: #E74C3C; 
            color: #FFFFFF; 
            padding: 6px 14px;
        }
        .btn-delete:hover { background-color: #C0392B; }
        
        .btn-edit { background-color: #D4A843; color: #0B1A3A; }
        .btn-edit:hover { background-color: #C49A3A; }

        .empty-state { text-align: center; padding: 40px 20px; color: #7F8C8D; }
        .empty-state .icon { width: 48px; height: 48px; object-fit: contain; margin-bottom: 10px; }

        /* Admin Dropdown */
        .admin-dropdown {
            position: relative;
            display: inline-block;
        }
        .admin-dropdown-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 6px 12px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
            font-size: 14px;
            color: #2C3E50;
            font-family: 'Inter', sans-serif;
        }
        .admin-dropdown-btn:hover { background-color: rgba(0,0,0,0.05); }
        .dropdown-arrow { font-size: 10px; transition: transform 0.3s ease; }
        .admin-dropdown-btn.active .dropdown-arrow { transform: rotate(180deg); }
        .admin-dropdown-menu {
            display: none;
            position: absolute;
            right: 0;
            top: 110%;
            background: #FFFFFF;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            min-width: 180px;
            padding: 8px 0;
            z-index: 1000;
            border: 1px solid #E8ECF0;
        }
        .admin-dropdown-menu.show { display: block; }
        .dropdown-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 18px;
            color: #2C3E50;
            text-decoration: none;
            font-size: 14px;
            transition: background-color 0.3s ease;
            cursor: pointer;
        }
        .dropdown-item:hover { background-color: #F5F7FA; }
        .dropdown-divider { border: none; border-top: 1px solid #E8ECF0; margin: 4px 12px; }

        @media (max-width: 768px) {
            .admin-sidebar { transform: translateX(-100%); width: 280px; }
            .admin-sidebar.open { transform: translateX(0); }
            .admin-main { margin-left: 0; padding: 20px; }
            .admin-hamburger { display: flex; }
            .admin-header h1 { font-size: 22px; }
        }
        @media (max-width: 480px) {
            .admin-table { font-size: 12px; }
            .admin-table th, .admin-table td { padding: 8px 10px; }
        }
    </style>
</head>
<body>

    <div class="admin-panel">
                <div class="sidebar-skeleton" aria-hidden="true"><div class="skel-logo"></div><div class="skel-line" style="width:70%;margin:0 auto 24px;"></div><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div><div class="skel-line"></div></div>
        <aside class="admin-sidebar" id="adminSidebar">
            <div class="logo">
                <img src="images/new-logo.png" alt="ISSE Logo">
                <h3>ISSE Admin</h3>
                <p>Institute of Space Science & Engineering</p>
            </div>
            <a href="admin-dashboard.html" class="nav-item" id="navDashboard">
                <img src="icons/dashboard-icon.png" alt="Dashboard" class="icon"> Dashboard
            </a>
            <a href="admin-news.html" class="nav-item" id="navNews">
                <img src="icons/news-icon-admin.png" alt="News" class="icon"> News Management
            </a>
            <a href="admin-subscribers.html" class="nav-item" id="navSubscribers">
                <img src="icons/subscribers-icon.png" alt="Subscribers" class="icon"> Subscribers
            </a>
            <a href="admin-messages.html" class="nav-item active" id="navMessages">
                <img src="icons/messages-icon.png" alt="Messages" class="icon"> Contact Messages
            </a>
      
            <a href="admin-admins.html" class="nav-item" id="navAdmins">
                <img src="icons/admins-icon.png" alt="Admins" class="icon"> Admin Management
            </a>
            <a href="admin-audit.html" class="nav-item" id="navAudit">
                <img src="icons/audit-icon.png" alt="Audit" class="icon"> Audit Log
            </a>
            <a href="admin-banners.html" class="nav-item" id="navBanners">
    <img src="icons/banner-icon.png" alt="Banners" class="icon"> Banners
</a>
<a href="admin-content.html" class="nav-item" id="navContent">
    <img src="icons/content-icon.png" alt="Content" class="icon"> Site Content
</a>
<a href="admin-programs.html" class="nav-item" id="navPrograms">
    <img src="icons/programs-icon.png" alt="Programs" class="icon"> Programs
</a>
<a href="#" class="nav-item" id="navAcademyPanel">
    <img src="icons/academy-icon.png" alt="Academy Panel" class="icon"> Academy Panel
</a>
            <a href="#" class="nav-item logout" id="logoutBtn">
                <img src="icons/logout-icon.png" alt="Logout" class="icon"> Logout
            </a>
        </aside>

        <main class="admin-main">
            <div class="admin-header">
                <div style="display: flex; align-items: center; gap: 15px;">
                    <button class="admin-hamburger" id="adminHamburger">
                        <span></span><span></span><span></span>
                    </button>
                    <h1>Contact Messages</h1>
                </div>
                <div class="admin-info">
                    <button class="dark-toggle" id="darkToggle" aria-label="Toggle dark mode">
        <img src="icons/moon-icon.png" alt="Dark Mode" id="darkIcon">
    </button>
                    <div class="admin-dropdown">
                        <button class="admin-dropdown-btn" id="adminDropdownBtn">
                            <span id="adminNameDisplay">Admin</span>
                            <span class="role-badge" id="adminRoleDisplay">Super Admin</span>
                            <span class="dropdown-arrow">▼</span>
                        </button>
                        <div class="admin-dropdown-menu" id="adminDropdownMenu">
                            <a href="admin-profile.html" class="dropdown-item">
                                <span>👤</span> Profile
                            </a>
                            <hr class="dropdown-divider">
                            <a href="#" class="dropdown-item" id="logoutDropdownBtn">
                                <span>🚪</span> Logout
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="admin-table-wrapper">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Program</th>
                            <th>Message</th>
                            <th>Date</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="messagesTableBody">
                    </tbody>
                </table>
            </div>
        </main>
    </div>
<script src="supabase-config.js"></script>
    <script>
    const supabaseClient = db;
    let currentAdmin = null;

    // ==================== SESSION CHECK ====================
initDarkModeToggle();
(async function() {
    currentAdmin = await getCurrentAdmin();
    if (!currentAdmin) {
        window.location.replace('admin-login.html');
        return;
    }

    // Messages is Super Admin / Admin only
    if (currentAdmin.role !== 'Super Admin' && currentAdmin.role !== 'Admin') {
        window.location.replace('admin-dashboard.html');
        return;
    }

    document.getElementById('adminNameDisplay').textContent = currentAdmin.username;
    document.getElementById('adminRoleDisplay').textContent = currentAdmin.role;
    
    // Show/Hide sidebar items based on role
    const role = currentAdmin.role;
    document.getElementById('navAcademyPanel').style.display = (role === 'Super Admin') ? 'flex' : 'none';
document.getElementById('navAcademyPanel').href = ACADEMY_URL;

    document.getElementById('navSubscribers').style.display = (role === 'Super Admin' || role === 'Admin') ? 'flex' : 'none';
                document.getElementById('navMessages').style.display = (role === 'Super Admin' || role === 'Admin') ? 'flex' : 'none';
    document.getElementById('navAdmins').style.display = (role === 'Super Admin') ? 'flex' : 'none';
    document.getElementById('navAudit').style.display = (role === 'Super Admin') ? 'flex' : 'none';
    document.body.classList.add('nav-ready');
    
})();

    async function loadMessages() {
        const tbody = document.getElementById('messagesTableBody');
        try {
            const { data: messages, error } = await supabaseClient.from('contact_messages')
                .select('*').order('date', { ascending:false });
            if (error) throw error;
            const rows=messages||[];
            if (!rows.length) {
                tbody.innerHTML=`<tr><td colspan="7"><div class="empty-state"><img src="icons/empty-icon.png" alt="No messages" class="icon"><p>No contact messages yet.</p></div></td></tr>`;
                return;
            }
            tbody.innerHTML=rows.map((msg,index)=>`
                <tr>
                    <td>${index+1}</td>
                    <td><strong>${escapeHtml(msg.name)}</strong></td>
                    <td>${escapeHtml(msg.email)}</td>
                    <td>${escapeHtml(msg.program || 'Not specified')}</td>
                    <td class="message-preview">${escapeHtml((msg.message||'').substring(0,100))}${(msg.message||'').length>100?'...':''}</td>
                    <td>${msg.date ? new Date(msg.date).toLocaleString() : 'N/A'}</td>
                    <td><div class="actions">
    <a class="btn-small btn-edit" href="admin-message-thread.html?id=${encodeURIComponent(msg.id)}">👁️ View</a>
    <button class="btn-small btn-delete" onclick="deleteMessage('${escapeJs(msg.id)}')">🗑️ Delete</button>
</div></td>
                </tr>`).join('');
        } catch(error) {
            console.error('Error loading messages:',error);
            tbody.innerHTML=`<tr><td colspan="7"><div class="empty-state"><p style="color:red;">❌ Error loading messages. Please check console.</p></div></td></tr>`;
        }
    }

    function escapeHtml(value) {
        return String(value ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');
    }
    function escapeJs(value) { return String(value ?? '').replaceAll("'", "\\'"); }

    async function viewMessage(id) {
        try {
            const { data: msg, error } = await supabaseClient.from('contact_messages').select('*').eq('id',id).single();
            if (error) throw error;

            const { error: readError } = await supabaseClient.from('contact_messages').update({read:true}).eq('id',id);
            if (readError) console.warn('Could not mark message as read:',readError);

            alert(`📩 Message from: ${msg.name}\n📧 Email: ${msg.email}\n📱 Phone: ${msg.phone || 'N/A'}\n📚 Program: ${msg.program || 'Not specified'}\n📅 Date: ${msg.date ? new Date(msg.date).toLocaleString() : 'N/A'}\n\n💬 Message:\n${msg.message}`);
            await loadMessages();
        } catch(error) {
            console.error('Error viewing message:',error);
            alert('Error loading message details.');
        }
    }

    async function deleteMessage(id) {
    if (!confirm('Are you sure you want to delete this message?')) return;
    try {
        // First get the name for logging
        const { data: item } = await supabaseClient
            .from('contact_messages')
            .select('name')
            .eq('id', id)
            .single();
        
        const { error } = await supabaseClient
            .from('contact_messages')
            .delete()
            .eq('id', id);

        if (error) throw error;

                await logActivity('Deleted Message', currentAdmin, { name: item?.name || 'Unknown' });
        await loadMessages();
        alert('✅ Message deleted successfully!');
    } catch (error) {
        console.error('Error deleting message:', error);
        alert(`❌ Error deleting message: ${error.message}`);
    }
}

    window.loadMessages=loadMessages;
    window.viewMessage=viewMessage;
    window.deleteMessage=deleteMessage;

    document.getElementById('adminHamburger').addEventListener('click',()=>document.getElementById('adminSidebar').classList.toggle('open'));
        document.getElementById('logoutBtn').addEventListener('click', async e => {
        e.preventDefault();
                await logActivity('Logout', currentAdmin, {});
        await db.auth.signOut();
        window.location.replace('admin-login.html');
    });
    loadMessages();
// ==================== ADMIN DROPDOWN ====================
const dropdownBtn = document.getElementById('adminDropdownBtn');
const dropdownMenu = document.getElementById('adminDropdownMenu');

if (dropdownBtn && dropdownMenu) {
    dropdownBtn.addEventListener('click', function(e) {
        e.stopPropagation();
        this.classList.toggle('active');
        dropdownMenu.classList.toggle('show');
    });

    // Close dropdown when clicking outside
    document.addEventListener('click', function(e) {
        if (!dropdownBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
            dropdownBtn.classList.remove('active');
            dropdownMenu.classList.remove('show');
        }
    });

    // Logout from dropdown
        const logoutDropdownBtn = document.getElementById('logoutDropdownBtn');
    if (logoutDropdownBtn) {
        logoutDropdownBtn.addEventListener('click', async function(e) {
            e.preventDefault();
            await logActivity('Logout', currentAdmin, {});
                            await db.auth.signOut();
                window.location.replace('admin-login.html');
        });
    }
}
</script>
</body>
</html>
